# Scaffolded by fsm-compiler-ts, yours to edit -- add your actors' own
# dependencies here. `--overwrite generated-only` (what @pgfsm/cli uses)
# never rewrites it once it exists.
# Python worker for the Activity Gateway. The SDK itself lives in the
# published pgfsm-async-worker-sdk package; this directory only holds the
# actors, their compiler-generated registry and run_async_worker.py.
#
#   uv run run_async_worker.py list    # print the actors in the registry
#   uv run run_async_worker.py start   # connect to the gateway and serve
#
# Without uv: `python3 -m pip install "pgfsm-async-worker-sdk>=0.2.0,<0.3"`,
# then `python3 run_async_worker.py start`.
[project]
name = "pgfsm-async-worker-python"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "pgfsm-async-worker-sdk>=0.2.0,<0.3",
]

[tool.uv]
# An app, not an installable package: uv only manages its environment.
package = false

# test-apps only: run against the SDK source in this repo, not PyPI.
[tool.uv.sources]
pgfsm-async-worker-sdk = { path = "../../../../packages/fsm-async-worker-sdk-python", editable = true }
