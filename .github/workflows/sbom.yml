name: SBOM

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write # needed to attach the SBOM as a release asset

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate CycloneDX SBOM
        # cdxgen walks all three ecosystems in one pass:
        # Deno (deno.lock), Node (packages/database-src), Rust (fsm_core extension).
        run: npx @cyclonedx/cdxgen@latest -r . -o bom.json
        env:
          FETCH_LICENSE: "true"

      - name: Scan SBOM for known CVEs (grype)
        # Fails the build on any High or Critical vulnerability.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:bom.json --fail-on high

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bom
          path: bom.json
          if-no-files-found: error

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: bom.json

  # Feeds the SBOM into GitHub's dependency graph so Dependabot raises alerts on
  # vulnerable dependencies continuously — not just at build time (grype above).
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to submit a dependency snapshot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Submit dependency snapshot
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          dependency-snapshot: true
