name: SBOM

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

# Read-only by default; only the two jobs that write (attach-release,
# dependency-submission) get contents: write, and neither runs on a PR.
permissions:
  contents: read

# Same scheme as ci.yml: a new PR push cancels the older run; push/release
# runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate CycloneDX SBOM
        # cdxgen walks all three ecosystems in one pass:
        # Deno (deno.lock), Node (packages/database-src), Rust (fsm_core extension).
        run: npx @cyclonedx/cdxgen@latest -r . -o bom.json
        env:
          FETCH_LICENSE: "true"

      - name: Scan SBOM for known CVEs (grype)
        # Fails the build on any High or Critical vulnerability.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype sbom:bom.json --fail-on high

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bom
          path: bom.json
          if-no-files-found: error

  # Its own job so that contents: write (needed to upload a release asset) is
  # granted only on release events, never to the PR runs of the job above.
  attach-release:
    if: github.event_name == 'release'
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # attach the SBOM as a release asset
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bom

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: bom.json

  # Feeds the SBOM into GitHub's dependency graph so Dependabot raises alerts on
  # vulnerable dependencies continuously — not just at build time (grype above).
  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # required to submit a dependency snapshot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Submit dependency snapshot
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          dependency-snapshot: true
