name: crates publish

# Publishes packages/fsm-async-worker-sdk-rust to crates.io as
# pgfsm-async-worker-sdk from an `async-worker-sdk-rs-v<version>` tag. The
# tag's version must match Cargo.toml's. (pgfsm-proto-codegen publishes from
# proto-publish.yml instead, in step with its other languages.)
#
# Uses the CARGO_REGISTRY_TOKEN secret, the same one proto-publish.yml uses.

on:
  push:
    tags:
      - "async-worker-sdk-rs-v[0-9]*"

permissions:
  contents: read

jobs:
  crates:
    name: Publish pgfsm-async-worker-sdk to crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fsm-async-worker-sdk-rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Root rust-toolchain.toml, found by rustup's upward search.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      - name: Check tag matches Cargo.toml
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          want="${TAG_VERSION#async-worker-sdk-rs-v}"
          have="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$want" != "$have" ]]; then
            echo "::error::tag version $want != Cargo.toml version $have"
            exit 1
          fi
          echo "VERSION=$have" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked

      # crates.io rejects re-publishing a version, so skip (rather than fail)
      # when a re-run of this release finds it already there.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "pgfsm-release (github.com/pgfsm/fsm)" \
            "https://crates.io/api/v1/crates/pgfsm-async-worker-sdk/$VERSION")
          if [[ "$status" == "200" ]]; then
            echo "pgfsm-async-worker-sdk $VERSION is already on crates.io; skipping."
            exit 0
          fi
          cargo publish --locked
