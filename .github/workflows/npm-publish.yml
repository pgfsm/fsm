name: npm publish

# @pgfsm/proto-codegen is deliberately not here: it releases together with
# its PyPI / crates.io / Go counterparts from one proto-v* tag, in
# proto-publish.yml (whose npm job mirrors the deno pack steps below — keep
# the two in step).
#
# @pgfsm/async-worker-gateway isn't here either: gateway-release.yml publishes
# it together with its container image from the async-worker-gateway-v* tag
# (#486), so the two can't go out of sync.
#
# Before anything is built, a preflight step (#445) stops the release if:
# - on a tag push, the tag's version isn't the package's deno.json version
#   (a tag pushed before the bump PR merged would otherwise build the old
#   version);
# - the commit isn't on main, so only code that passed main's CI ships
#   (CI runs the tests; this workflow doesn't repeat them).
# A version that's already on npm is skipped rather than failed, so re-running
# a partly failed release (or dispatching `all`) is safe. workflow_dispatch has
# no tag, so it publishes whatever version deno.json has on the dispatched
# ref, which must also be on main.

on:
  push:
    tags:
      - "compiler-v[0-9]*"
      - "cli-v[0-9]*"
      - "db-v[0-9]*"
      - "sync-worker-v[0-9]*"
      - "async-worker-sdk-v[0-9]*"
      - "logging-v[0-9]*"
      - "ctl-v[0-9]*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - compiler
          - cli
          - db
          - sync-worker
          - async-worker-sdk
          - logging
          - ctl
          - all

permissions:
  contents: read

jobs:
  publish:
    name: publish ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dnt: true means this package needs @deno/dnt's dependency-mapping
          # support — either to ship a CLI `bin` (deno pack only emits a
          # library; it does not synthesize a package.json `bin` field, so a
          # CLI entry point packed that way is unreachable from npx —
          # confirmed against the Deno docs' own "Limitations" section:
          # https://docs.deno.com/runtime/reference/cli/pack/), or to declare
          # a real npm dependency deno pack can't express (deno pack's
          # package.json is 100% auto-inferred from the module graph with no
          # override mechanism — db needs @types/pg as a real dependency
          # since its own public .d.ts references pg's types, which dnt's
          # `package.dependencies` option supports and deno pack doesn't;
          # see #287). These packages build through `deno task build:npm`
          # (packages/fsm-compiler-ts/scripts/build-npm.ts and friends),
          # which uses @deno/dnt to transpile + Node-shim the Deno source
          # into `dist/`. Packages without a CLI or a dependency-mapping
          # need (or without a dnt build script yet) stay on `deno pack`.
          # logging has neither today (no CLI bin, no real dependency
          # override) — it's on dnt purely for consistency with every other
          # published package here, and because dnt correctly declares its
          # own npm:-specifier deps (@logtape/logtape, @logtape/otel) as real
          # `dependencies` instead of `deno pack`'s auto-inferred
          # package.json, which has no override mechanism to add them if a
          # future dependency ever needed one (#293).
          - id: compiler
            path: packages/fsm-compiler-ts
            tag_prefix: compiler-v
            dnt: true
          # bin `pgfsm` (SPEC-004). Depends on a published @pgfsm/compiler with
          # the create/add library API (#383), mapped from its deno.json version.
          - id: cli
            path: packages/fsm-cli-ts
            tag_prefix: cli-v
            dnt: true
          - id: db
            path: packages/fsm-core-db-ts
            tag_prefix: db-v
            dnt: true
          - id: sync-worker
            path: packages/fsm-sync-worker-ts
            tag_prefix: sync-worker-v
            dnt: true
          # No CLI bin — on dnt to declare @pgfsm/proto-codegen as a real npm
          # dependency (build-npm.ts maps its subpath imports) instead of
          # inlining the generated stubs (#358).
          - id: async-worker-sdk
            path: packages/fsm-async-worker-sdk-ts
            tag_prefix: async-worker-sdk-v
            dnt: true
          - id: logging
            path: packages/fsm-logging-ts
            tag_prefix: logging-v
            dnt: true
          - id: ctl
            path: packages/fsm-ctl-ts
            tag_prefix: ctl-v
            dnt: true

    steps:
      - name: Gate — decide if this package should publish
        id: gate
        env:
          TAG_PREFIX: ${{ matrix.tag_prefix }}
          INPUT: ${{ inputs.package }}
          ID: ${{ matrix.id }}
        run: |
          SHOULD_RUN=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" == "refs/tags/$TAG_PREFIX"* ]]; then
              SHOULD_RUN=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT" == "all" || "$INPUT" == "$ID" ]]; then
              SHOULD_RUN=true
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.should_run == 'true'
        with:
          fetch-depth: 0 # the preflight checks the commit is on origin/main

      # Installs proto and runs `proto install` against the root .prototools,
      # so the Deno version is sourced from the repo pin, not hardcoded here.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        if: steps.gate.outputs.should_run == 'true'
        with:
          auto-install: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # See the header: tag matches deno.json, commit is on main, and the
      # version isn't on npm yet (skip, not fail). Also picks the dist-tag: a
      # prerelease (e.g. 0.1.0-alpha.0) must publish under its own one, since
      # `npm publish` with no --tag makes any version `latest`.
      - name: Preflight — tag, main, already published
        id: preflight
        if: steps.gate.outputs.should_run == 'true'
        working-directory: ${{ matrix.path }}
        env:
          TAG_PREFIX: ${{ matrix.tag_prefix }}
        run: |
          set -euo pipefail
          name=$(jq -r .name deno.json)
          version=$(jq -r .version deno.json)

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag_version=${GITHUB_REF_NAME#"$TAG_PREFIX"}
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::tag version $tag_version != deno.json version $version ($GITHUB_REF_NAME at $GITHUB_SHA): tag the commit that bumps deno.json"
              exit 1
            fi
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA isn't on main: release only from a commit merged to main"
            exit 1
          fi

          dist_tag=latest
          if [[ "$version" =~ -([a-zA-Z]+)(\.|$) ]]; then dist_tag=${BASH_REMATCH[1]}; fi

          # Output, not exit status: some npm versions print nothing and exit
          # 0 for a version that doesn't exist.
          publish=true
          if [[ -n "$(npm view "$name@$version" version 2>/dev/null)" ]]; then
            echo "::notice::$name@$version is already on npm; skipping."
            publish=false
          fi

          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "$name@$version (dist-tag $dist_tag): publish=$publish" >>"$GITHUB_STEP_SUMMARY"

      - name: Pack (library only)
        if: steps.preflight.outputs.publish == 'true' && matrix.dnt != true
        working-directory: ${{ matrix.path }}
        run: deno pack

      - name: Publish (library only)
        if: steps.preflight.outputs.publish == 'true' && matrix.dnt != true
        working-directory: ${{ matrix.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.preflight.outputs.dist_tag }}
        run: npm publish ./*.tgz --access public --tag "$DIST_TAG"

      # dnt path (lib + npx-able CLI bin) — see the matrix comment above for why.
      - name: Build (dnt) — lib + CLI bin
        if: steps.preflight.outputs.publish == 'true' && matrix.dnt == true
        working-directory: ${{ matrix.path }}
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: deno task build:npm "$VERSION" --copy-readme

      - name: Publish (dnt dist)
        if: steps.preflight.outputs.publish == 'true' && matrix.dnt == true
        working-directory: ${{ matrix.path }}/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.preflight.outputs.dist_tag }}
        run: npm publish --access public --tag "$DIST_TAG"
