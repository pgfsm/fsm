name: npm publish

# @pgfsm/proto-codegen is deliberately not here: it releases together with
# its PyPI / crates.io / Go counterparts from one proto-v* tag, in
# proto-publish.yml (whose npm job mirrors the deno pack steps below — keep
# the two in step).

on:
  push:
    tags:
      - "compiler-v[0-9]*"
      - "db-v[0-9]*"
      - "sync-worker-v[0-9]*"
      - "async-worker-gateway-v[0-9]*"
      - "async-worker-sdk-v[0-9]*"
      - "logging-v[0-9]*"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - compiler
          - db
          - sync-worker
          - async-worker-gateway
          - async-worker-sdk
          - logging
          - all

jobs:
  publish:
    name: publish ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dnt: true means this package needs @deno/dnt's dependency-mapping
          # support — either to ship a CLI `bin` (deno pack only emits a
          # library; it does not synthesize a package.json `bin` field, so a
          # CLI entry point packed that way is unreachable from npx —
          # confirmed against the Deno docs' own "Limitations" section:
          # https://docs.deno.com/runtime/reference/cli/pack/), or to declare
          # a real npm dependency deno pack can't express (deno pack's
          # package.json is 100% auto-inferred from the module graph with no
          # override mechanism — db needs @types/pg as a real dependency
          # since its own public .d.ts references pg's types, which dnt's
          # `package.dependencies` option supports and deno pack doesn't;
          # see #287). These packages build through `deno task build:npm`
          # (packages/fsm-compiler-ts/scripts/build-npm.ts and friends),
          # which uses @deno/dnt to transpile + Node-shim the Deno source
          # into `dist/`. Packages without a CLI or a dependency-mapping
          # need (or without a dnt build script yet) stay on `deno pack`.
          # logging has neither today (no CLI bin, no real dependency
          # override) — it's on dnt purely for consistency with every other
          # published package here, and because dnt correctly declares its
          # own npm:-specifier deps (@logtape/logtape, @logtape/otel) as real
          # `dependencies` instead of `deno pack`'s auto-inferred
          # package.json, which has no override mechanism to add them if a
          # future dependency ever needed one (#293).
          - id: compiler
            path: packages/fsm-compiler-ts
            tag_prefix: compiler-v
            dnt: true
          - id: db
            path: packages/fsm-core-db-ts
            tag_prefix: db-v
            dnt: true
          - id: sync-worker
            path: packages/fsm-sync-worker-ts
            tag_prefix: sync-worker-v
            dnt: true
          - id: async-worker-gateway
            path: packages/fsm-async-worker-gateway-ts
            tag_prefix: async-worker-gateway-v
            dnt: true
          # No CLI bin — on dnt to declare @pgfsm/proto-codegen as a real npm
          # dependency (build-npm.ts maps its subpath imports) instead of
          # inlining the generated stubs (#358).
          - id: async-worker-sdk
            path: packages/fsm-async-worker-sdk-ts
            tag_prefix: async-worker-sdk-v
            dnt: true
          - id: logging
            path: packages/fsm-logging-ts
            tag_prefix: logging-v
            dnt: true

    steps:
      - name: Gate — decide if this package should publish
        id: gate
        run: |
          SHOULD_RUN=false
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref }}" == refs/tags/${{ matrix.tag_prefix }}* ]]; then
              SHOULD_RUN=true
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT="${{ inputs.package }}"
            if [[ "$INPUT" == "all" || "$INPUT" == "${{ matrix.id }}" ]]; then
              SHOULD_RUN=true
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.should_run == 'true'

      # Installs proto and runs `proto install` against the root .prototools,
      # so the Deno version is sourced from the repo pin, not hardcoded here.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        if: steps.gate.outputs.should_run == 'true'
        with:
          auto-install: true

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # A prerelease version (e.g. 0.1.0-alpha.0) must publish under its own
      # dist-tag — `npm publish` with no --tag defaults to `latest` no matter
      # what the version string says, so without this an alpha would silently
      # become the default `npm install` resolution.
      - name: Determine npm dist-tag
        id: dist-tag
        if: steps.gate.outputs.should_run == 'true'
        working-directory: ${{ matrix.path }}
        run: |
          VERSION=$(node -p "require('./deno.json').version")
          if [[ "$VERSION" =~ -([a-zA-Z]+)(\.|$) ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pack (library only)
        if: steps.gate.outputs.should_run == 'true' && matrix.dnt != true
        working-directory: ${{ matrix.path }}
        run: deno pack

      - name: Publish (library only)
        if: steps.gate.outputs.should_run == 'true' && matrix.dnt != true
        working-directory: ${{ matrix.path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish $(ls *.tgz) --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      # dnt path (lib + npx-able CLI bin) — see the matrix comment above for why.
      - name: Build (dnt) — lib + CLI bin
        if: steps.gate.outputs.should_run == 'true' && matrix.dnt == true
        working-directory: ${{ matrix.path }}
        run: |
          VERSION=$(node -p "require('./deno.json').version")
          deno task build:npm "$VERSION" --copy-readme

      - name: Publish (dnt dist)
        if: steps.gate.outputs.should_run == 'true' && matrix.dnt == true
        working-directory: ${{ matrix.path }}/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"
