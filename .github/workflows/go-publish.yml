name: go publish

# Releases packages/fsm-async-worker-sdk-go, the Go module
# github.com/pgfsm/fsm/packages/fsm-async-worker-sdk-go, from an
# `async-worker-sdk-go-v<version>` tag. Go modules have no registry upload: a
# module in a repo subdirectory is released by a tag prefixed with that
# subdirectory (`packages/fsm-async-worker-sdk-go/v<version>`), which the Go
# module proxy then serves. This workflow runs the tests first and only then
# pushes that module tag, so an untested commit is never released. (Go has no
# version field in go.mod; the tag is the version.)

on:
  push:
    tags:
      - "async-worker-sdk-go-v[0-9]*"

permissions:
  contents: read

jobs:
  go:
    name: Release fsm-async-worker-sdk-go
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/fsm-async-worker-sdk-go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/fsm-async-worker-sdk-go/go.mod
          cache-dependency-path: packages/fsm-async-worker-sdk-go/go.sum

      - name: Version from tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          version="${TAG_VERSION#async-worker-sdk-go-v}"
          # Semver, optionally with a prerelease suffix (e.g. 0.2.0-alpha.0).
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG_VERSION doesn't carry a semver version"
            exit 1
          fi
          # A v2+ Go module needs a /vN suffix on its module path.
          if [[ "${version%%.*}" -ge 2 ]] && ! grep -q "^module .*/v${version%%.*}$" go.mod; then
            echo "::error::v${version%%.*}+ needs go.mod's module path to end in /v${version%%.*}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: go vet + test
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -race ./...

      - name: Push module tag
        run: |
          tag="packages/fsm-async-worker-sdk-go/v$VERSION"
          existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$GITHUB_SHA" ]]; then
              echo "$tag already points at $GITHUB_SHA; skipping."
              exit 0
            fi
            echo "::error::$tag already exists at $existing, not $GITHUB_SHA."
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      # Ask the proxy for the new version so it's fetched and cached now (and
      # shows up on pkg.go.dev) instead of on the first consumer's `go get`.
      # Best effort: the tag is the release either way.
      - name: Warm the Go module proxy
        run: |
          curl -fsS "https://proxy.golang.org/github.com/pgfsm/fsm/packages/fsm-async-worker-sdk-go/@v/v$VERSION.info" \
            || echo "::warning::proxy.golang.org hasn't picked up v$VERSION yet; it will on first use."
