# Releases fsm_core from an fsm_core-v<version> tag (SPEC-016). Each job
# runs only if the one before it passed:
#
#   1. preflight       the tag is fsm_core-v<x.y.z> (any version with committed
#                      generated files can be released, older ones too);
#   2. build           build-both-pgext-and-fullsqlscript.ts --version <v>,
#                      which needs the committed, generated
#                        all-output/fsm_core--<v>.sql
#                        all-output-with-prerequisite-check/fsm_core--<v>.sql
#                      (npm run generateBothPgextAndFullsqlscript, locally) and
#                      writes full-release/full-release-<v>/;
#   3. compare         compare-pgext-and-fullsqlscript.ts <v> on PostgreSQL
#                      15, 16, 17 and 18: the extension and the full script
#                      must install the same fsm_core;
#   4. pgxn            uploads the zip to PGXN when PGXN_USERNAME and
#                      PGXN_PASSWORD are set (status uploaded, or already when
#                      PGXN has the version); otherwise status skipped. A
#                      failed upload stops the release;
#   5. github-release  only on status uploaded, already or skipped: a GitHub
#                      release with
#                        fsm_core--<v>.sql   the full script (plain-SQL
#                                            install), for a new database
#                        fsm_core-<v>.zip    the PGXN extension bundle, which
#                                            also holds every upgrade script
#                                            fsm_core--<from>--<to>.sql up to <v>
#                        SHA256SUMS
#
# If compare fails (or is cancelled), the cleanup job deletes the build
# artifact, so a public repo's failed run offers no untested files; re-run the
# whole workflow then, not just the failed jobs. The artifact also expires
# after a day.
#
# Re-running is safe: PGXN's "already" counts as success, and the GitHub
# assets are uploaded with --clobber. workflow_dispatch re-runs a release
# from its tag.
name: fsm_core release

on:
  push:
    tags:
      - "fsm_core-v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)run, e.g. fsm_core-v2.3.2
        required: true
        type: string

permissions:
  contents: read

env:
  TAG_PREFIX: fsm_core-v
  DB_DIR: packages/database-src

jobs:
  preflight:
    name: 1. preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: The tag is fsm_core-v<x.y.z>
        id: plan
        env:
          GIT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$GIT_TAG" == "$TAG_PREFIX"* ]] || { echo "::error::$GIT_TAG is not a $TAG_PREFIX* tag"; exit 1; }
          version=${GIT_TAG#"$TAG_PREFIX"}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$version is not x.y.z"; exit 1; }
          {
            echo "ref=refs/tags/$GIT_TAG"
            echo "tag=$GIT_TAG"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  build:
    name: 2. build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.DB_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # build-both-pgext-and-fullsqlscript.ts runs under tsx.
      - name: npm install
        run: npm install

      - name: build-both-pgext-and-fullsqlscript.ts
        run: npm run -s buildBothPgextAndFullsqlscript -- --version "${{ needs.preflight.outputs.version }}"

      # The release folder, for the later jobs (its path stays relative to
      # DB_DIR).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsm-core-release
          path: ${{ env.DB_DIR }}/full-release/full-release-${{ needs.preflight.outputs.version }}/
          if-no-files-found: error
          # A backstop: the cleanup job deletes it at once when compare fails,
          # and a release finishes within minutes.
          retention-days: 1

  compare:
    name: 3. compare (PostgreSQL ${{ matrix.pg }})
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17", "18"]
    defaults:
      run:
        working-directory: ${{ env.DB_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsm-core-release
          path: ${{ env.DB_DIR }}

      - name: compare-pgext-and-fullsqlscript.ts
        run: deno run --allow-all compare-pgext-and-fullsqlscript.ts "${{ needs.preflight.outputs.version }}" --pg ${{ matrix.pg }}

  pgxn:
    name: 4. PGXN upload
    needs: [preflight, compare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.upload.outputs.status }}
    defaults:
      run:
        working-directory: ${{ env.DB_DIR }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsm-core-release
          path: ${{ env.DB_DIR }}

      - name: Upload to PGXN
        id: upload
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PGXN_USERNAME: ${{ secrets.PGXN_USERNAME }}
          PGXN_PASSWORD: ${{ secrets.PGXN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$PGXN_USERNAME" || -z "$PGXN_PASSWORD" ]]; then
            echo "PGXN secrets not set: skipping the upload." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "status=skipped" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if curl -fsS "https://api.pgxn.org/dist/fsm_core/$VERSION/META.json" >/dev/null 2>&1; then
            echo "fsm_core $VERSION is already on PGXN." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "status=already" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -u "$PGXN_USERNAME:$PGXN_PASSWORD" \
            -F "archive=@full-release/full-release-$VERSION/fsm_core-$VERSION.zip" \
            https://manager.pgxn.org/upload
          echo "Uploaded fsm_core $VERSION to PGXN." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "status=uploaded" >>"$GITHUB_OUTPUT"

  github-release:
    name: 5. GitHub release
    needs: [preflight, pgxn]
    if: contains(fromJSON('["uploaded", "already", "skipped"]'), needs.pgxn.outputs.status)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ env.DB_DIR }}
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fsm-core-release
          path: ${{ env.DB_DIR }}

      - name: Collect the assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp "full-release/full-release-$VERSION/fsm_core--$VERSION.sql" \
             "full-release/full-release-$VERSION/fsm_core-$VERSION.zip" release/
          (cd release && sha256sum -- * >SHA256SUMS)
          ls -l release

      # "Latest" only for the highest fsm_core-v* tag: releasing an older
      # version (a backfill) must not take it from a newer release.
      - name: GitHub release
        run: |
          set -euo pipefail
          highest=$(git ls-remote --tags --refs origin "refs/tags/$TAG_PREFIX*" \
            | sed "s|.*refs/tags/$TAG_PREFIX||" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [[ -z "$highest" || "$highest" == "$VERSION" ]]; then
            latest=true
          else
            latest=false
            echo "fsm_core $VERSION is older than $highest: not marked Latest." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --latest="$latest" --title "fsm_core $VERSION" --notes "$(cat <<EOF
          fsm_core $VERSION (SPEC-016). Requires PostgreSQL 15+ with the ltree, pg_cron and pgmq extensions; tested on 15, 16, 17 and 18.

          - New database: run \`fsm_core--$VERSION.sql\` once, as the database owner, in pg_cron's database:
            \`psql "\$DATABASE_URL" -1 -v ON_ERROR_STOP=1 -f fsm_core--$VERSION.sql\`
          - Upgrade: apply each \`fsm_core--<from>--<to>.sql\` in order, from \`SELECT fsm_core.version();\`. The upgrade scripts are in \`fsm_core-$VERSION.zip\` (folder \`fsm_core-$VERSION/\`).
          - PGXN: \`fsm_core-$VERSION.zip\` (\`CREATE EXTENSION fsm_core CASCADE\`).

          See packages/database-src/README.md.
          EOF
          )"
          fi
          gh release upload "$TAG" release/* --clobber

  cleanup:
    name: delete the untested build
    needs: compare
    if: always() && (needs.compare.result == 'failure' || needs.compare.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the fsm-core-release artifact
        run: |
          set -euo pipefail
          ids=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "fsm-core-release") | .id')
          for id in $ids; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
            echo "Deleted artifact $id"
          done
          echo "compare failed: deleted the untested build artifact." >>"$GITHUB_STEP_SUMMARY"
