# Smoke test of the Activity Gateway's Kubernetes reference manifests on kind
# (SPEC-007 step 2a, #457): builds the gateway and one worker image per
# language, deploys packages/fsm-async-worker-gateway-ts/deploy/k8s into a Pod
# Security "restricted" namespace, and checks every worker registers over TLS
# with its own token and serves an invoke. It builds five images and takes
# several minutes, so it runs only on pull requests that change the manifests,
# the Dockerfiles or this workflow, and on demand (Actions → k8s-smoke → Run
# workflow). To run it locally, see deploy/k8s/README.md ("Smoke test on kind").
name: k8s-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/fsm-async-worker-gateway-ts/deploy/**"
      - ".github/workflows/k8s-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: kind smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: pgfsm-smoke

      - name: Smoke test
        env:
          SKIP_CLUSTER: "1"
          CLUSTER: pgfsm-smoke
        run: packages/fsm-async-worker-gateway-ts/deploy/k8s/overlays/kind/smoke.sh
