name: proto publish

# Publishes one set of packages/fsm-proto-codegen stubs for TypeScript (npm),
# Python (PyPI), Rust (crates.io) and Go (a module tag), all at one version:
# - `proto-v<version>`      -> gen/      (async contracts): @pgfsm/proto-codegen,
#                              pgfsm-proto-codegen, .../fsm-proto-codegen/gen/go
# - `proto-sync-v<version>` -> gen-sync/ (Sync Executor, SPEC-018):
#                              @pgfsm/proto-codegen-sync, pgfsm-proto-codegen-sync,
#                              .../fsm-proto-codegen/gen-sync/go
# Only a tag triggers it, and every publish job waits on `verify`, so the four
# registries can't be released out of step.
# See the package README's "Publishing" for the release steps and the
# one-time registry setup.

on:
  push:
    tags:
      - "proto-v[0-9]*"
      - "proto-sync-v[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release manifests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dir: ${{ steps.version.outputs.dir }}
      npm_name: ${{ steps.version.outputs.npm_name }}
      crate: ${{ steps.version.outputs.crate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Deno from the root .prototools.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # Which set this tag releases, and under which names.
      - name: Version and package set from tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            proto-sync-v*)
              {
                echo "version=${GITHUB_REF_NAME#proto-sync-v}"
                echo "dir=gen-sync"
                echo "npm_name=@pgfsm/proto-codegen-sync"
                echo "crate=pgfsm-proto-codegen-sync"
              } >> "$GITHUB_OUTPUT" ;;
            proto-v*)
              {
                echo "version=${GITHUB_REF_NAME#proto-v}"
                echo "dir=gen"
                echo "npm_name=@pgfsm/proto-codegen"
                echo "crate=pgfsm-proto-codegen"
              } >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unexpected tag $GITHUB_REF_NAME"
              exit 1 ;;
          esac

      # All three manifests must carry the tag's version (and the protobuf
      # lower bound must match the generated code) before anything publishes.
      - name: Check manifests
        run: >-
          deno run --allow-read
          packages/fsm-proto-codegen/scripts/check-release-manifests.ts
          --dir "${{ steps.version.outputs.dir }}"
          "${{ steps.version.outputs.version }}"

  # Same deno pack + npm publish steps as npm-publish.yml's non-dnt path
  # (keep the two in step). deno pack works here without dnt: the generated
  # code is .js + .d.ts (nothing to transpile), there's no CLI bin, and the
  # one runtime dependency comes from <dir>/typescript/deno.json's
  # `npm:@bufbuild/protobuf` import. Checked against the packed tarball:
  # package.json declares that dependency and the license, and TypeScript
  # resolves each export's sibling .d.ts under `nodenext` and `bundler`. The
  # JavaScript-entrypoint warning deno pack prints (a JSR slow-types note) is
  # expected. Switch to a scripts/build-npm.ts (@deno/dnt) build if the package
  # ever needs a package.json field deno pack can't infer.
  # Staged through npm trusted publishing (#719): see npm-publish.yml's
  # header. Each npm package's trusted publisher on npmjs.com
  # (@pgfsm/proto-codegen and @pgfsm/proto-codegen-sync) names this file,
  # proto-publish.yml, and the staged version needs a maintainer's approval
  # before the SDKs can release against it.
  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    defaults:
      run:
        working-directory: packages/fsm-proto-codegen/${{ needs.verify.outputs.dir }}/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Deno and Node (hence npm) from the root .prototools. No setup-node:
      # npm authenticates through OIDC, so there's no token for an .npmrc.
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # A prerelease (e.g. 0.2.0-alpha.0) publishes under its own dist-tag;
      # `npm publish` with no --tag would make it `latest`.
      - name: Determine npm dist-tag
        id: dist-tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [[ "$VERSION" =~ -([a-zA-Z]+)(\.|$) ]]; then
            TAG="${BASH_REMATCH[1]}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: deno pack

      # npm rejects re-publishing a version, so skip (rather than fail) when
      # a re-run of this release finds it already there. Otherwise unpack
      # the tarball (`npm stage publish` packs the current directory), add
      # the `repository` deno pack can't infer (trusted publishing requires
      # it), and stage. Same steps as npm-publish.yml's library-only path.
      - name: Stage
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
          NPM_NAME: ${{ needs.verify.outputs.npm_name }}
          PKG_DIR: packages/fsm-proto-codegen/${{ needs.verify.outputs.dir }}/typescript
        run: |
          set -euo pipefail
          # Output, not exit status: some npm versions print nothing and exit
          # 0 for a version that doesn't exist.
          if [[ -n "$(npm view "$NPM_NAME@$VERSION" version 2>/dev/null)" ]]; then
            echo "$NPM_NAME@$VERSION is already on npm; skipping."
            exit 0
          fi
          tar -xzf ./*.tgz
          jq --arg url "git+https://github.com/$GITHUB_REPOSITORY.git" --arg dir "$PKG_DIR" \
            '.repository = {type: "git", url: $url, directory: $dir}' \
            package/package.json >package/package.json.tmp
          mv package/package.json.tmp package/package.json
          cd package
          "$GITHUB_WORKSPACE/scripts/npm-stage-publish.sh" "$DIST_TAG"

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): PyPI's publisher config names this workflow
    # file and this environment — no API token secret.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build packages/fsm-proto-codegen/${{ needs.verify.outputs.dir }}/python --outdir dist

      # skip-existing so re-running a partly failed release doesn't fail
      # here on files an earlier attempt already uploaded.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

  crates:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fsm-proto-codegen/${{ needs.verify.outputs.dir }}/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Root rust-toolchain.toml, found by rustup's upward search.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      # crates.io rejects re-publishing a version, so skip (rather than fail)
      # when a re-run of this release finds it already there.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          CRATE: ${{ needs.verify.outputs.crate }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "pgfsm-release (github.com/pgfsm/fsm)" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")
          if [[ "$status" == "200" ]]; then
            echo "$CRATE $VERSION is already on crates.io; skipping."
            exit 0
          fi
          cargo publish

  go:
    name: Tag Go module
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Go modules have no registry upload: a module in a subdirectory is
      # released by a tag prefixed with that subdirectory, and the Go module
      # proxy serves it from there. Tagged at the same commit as the
      # proto-v* / proto-sync-v* tag.
      # (A future v2+ would also need a /v2 suffix on go.mod's module path.)
      - name: Push module tag
        env:
          TAG: packages/fsm-proto-codegen/${{ needs.verify.outputs.dir }}/go/v${{ needs.verify.outputs.version }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$GITHUB_SHA" ]]; then
              echo "$TAG already points at $GITHUB_SHA; skipping."
              exit 0
            fi
            echo "::error::$TAG already exists at $existing, not $GITHUB_SHA."
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # Ask the proxy for the new version so it's fetched and cached now
      # (and shows up on pkg.go.dev) instead of on the first consumer's
      # `go get`. Best effort: the tag is the release either way.
      - name: Warm the Go module proxy
        env:
          VERSION: v${{ needs.verify.outputs.version }}
          GO_MODULE: github.com/pgfsm/fsm/packages/fsm-proto-codegen/${{ needs.verify.outputs.dir }}/go
        run: |
          curl -fsS "https://proxy.golang.org/$GO_MODULE/@v/$VERSION.info" \
            || echo "::warning::proxy.golang.org hasn't picked up $VERSION yet; it will on first use."
