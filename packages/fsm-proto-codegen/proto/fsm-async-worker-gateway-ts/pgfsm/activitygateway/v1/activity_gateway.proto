syntax = "proto3";

package pgfsm.activitygateway.v1;

option go_package = "github.com/pgfsm/fsm/packages/fsm-proto-codegen/gen/go/activitygateway/v1";

// Client-facing contract for the Activity Gateway. The orchestrator
// (asyncOperationWorkerlet.ts) is the only intended client — it calls
// Invoke() once per claimed PGMQ message for a compiled-language actor,
// after doing its own poll/claim/archive against Postgres. The gateway
// itself never touches the database.
//
// Adapted from the polygot-lang-ipc-worker prototype's proto/ipc.proto:
// the generic {function_name, payload_json} shape is replaced with the
// activity contract from KB-001 §3.2, identifying the actor by its full
// ActorPluginValidationResult identity (parent_fsm_name, parent_fsm_version,
// async_operation_type, async_operation_name, async_operation_version,
// async_operation_language) rather than a bare name/version pair — see
// sidecar_gateway.proto's RegisteredActor. async_operation_language is part
// of the identity (not just metadata) because the other five fields alone
// aren't guaranteed unique across languages.
//
// Originally shipped flat as activity-gateway.proto / package
// pgfsm.activitygateway, exempted from several STANDARD buf lint rules as
// an already-consumed contract (see #86/#87). That exemption's rationale
// (gatewayServer.ts/gatewayClient.ts loading it by exact filename via
// @grpc/proto-loader) no longer applies once real Connect-ES codegen
// replaced that runtime reflection — moved to this standard layout in #102,
// the same pass sidecar_gateway.proto (#100) already went through.
service ActivityGatewayService {
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc ListRegisteredActors(ListRegisteredActorsRequest) returns (ListRegisteredActorsResponse);
}

message InvokeRequest {
  string parent_fsm_name = 1;
  string parent_fsm_version = 2;
  string async_operation_type = 3;
  string async_operation_name = 4;
  string async_operation_version = 5;
  string async_operation_language = 6;
  string input_json = 7;
  string instance_id = 8;
  string correlation_id = 9;
  uint32 timeout_ms = 10;
}

message InvokeResponse {
  bool ok = 1;
  string output_json = 2;
  string error_code = 3;
  string error_message = 4;
  bool retriable = 5;
}

message ListRegisteredActorsRequest {}

message ListRegisteredActorsResponse {
  // "parentFsmName@parentFsmVersion@asyncOperationType@asyncOperationName@asyncOperationVersion@asyncOperationLanguage"
  // keys, one per actor currently registered by a live worker process.
  repeated string actor_keys = 1;
}
