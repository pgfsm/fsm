# kind overlay for the smoke test (smoke.sh): the base manifests plus the
# example PgBouncer pooler, with the locally built images loaded into kind
# instead of pulled. Postgres itself lives in its own namespace (postgres.yaml,
# applied separately by smoke.sh), outside the "restricted" one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../examples/pooler
# The gateway image smoke.sh built from this checkout, not the published one.
images:
  - name: ghcr.io/pgfsm/async-worker-gateway
    newName: pgfsm/async-worker-gateway
    newTag: dev
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name!=pgbouncer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
