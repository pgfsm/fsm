# Test-only Postgres for the kind smoke test: Supabase's image (pgmq, pg_cron)
# that the repo's migrations target. Not part of the reference manifests; in
# production point the pooler at your managed database.
apiVersion: v1
kind: Namespace
metadata:
  name: pgfsm-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pgfsm-db
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # Otherwise the Service named "postgres" injects POSTGRES_PORT=tcp://...,
      # which the image's init scripts take as the port.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: public.ecr.aws/supabase/postgres:15.8.1.085
          # How the Supabase CLI starts this image (`supabase start`): its init
          # scripts need these, and the image's config lives in /etc/postgresql.
          args: ["postgres", "-D", "/etc/postgresql"]
          env:
            - { name: POSTGRES_HOST, value: /var/run/postgresql }
            - { name: POSTGRES_USER, value: supabase_admin }
            - { name: POSTGRES_DB, value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - {
                name: JWT_SECRET,
                value: test-only-jwt-secret-with-at-least-32-characters,
              }
            - { name: JWT_EXP, value: "3600" }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "supabase_admin", "-h", "127.0.0.1"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pgfsm-db
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
