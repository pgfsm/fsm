# Test-only Postgres for the kind smoke test: Supabase's image (pgmq, pg_cron)
# that the repo's migrations target. Not part of the reference manifests; in
# production point the pooler at your managed database.
apiVersion: v1
kind: Namespace
metadata:
  name: pgfsm-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pgfsm-db
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: public.ecr.aws/supabase/postgres:15.8.1.085
          env:
            - { name: POSTGRES_PASSWORD, value: postgres }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pgfsm-db
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
