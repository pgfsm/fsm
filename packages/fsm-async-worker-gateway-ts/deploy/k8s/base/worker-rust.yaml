# Rust async worker: serves this project's rust actors through the
# gateway Service, with only its own token (key "rust" of
# activity-gateway-tokens). Scale it independently of the other languages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-worker-rust
  labels: {
    app.kubernetes.io/name: async-worker-rust,
    app.kubernetes.io/component: async-worker,
    app.kubernetes.io/part-of: pgfsm,
  }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: async-worker-rust }
  template:
    metadata:
      labels: {
        app.kubernetes.io/name: async-worker-rust,
        app.kubernetes.io/component: async-worker,
        app.kubernetes.io/part-of: pgfsm,
      }
    spec:
      # SIGTERM drains: new invokes are refused as retriable, in-flight ones
      # get PGFSM_SHUTDOWN_GRACE_MS (25 s) to finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: pgfsm/async-worker-rust:dev # replace with your registry's image
          args: ["start"]
          envFrom:
            - configMapRef: { name: async-worker-config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: token, mountPath: /etc/pgfsm/token, readOnly: true }
            - { name: ca, mountPath: /etc/pgfsm/ca, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: token
          secret:
            secretName: activity-gateway-tokens
            items: [{ key: rust, path: token }]
        - name: ca
          configMap: { name: activity-gateway-ca }
        - name: tmp
          emptyDir: {}
