# The pgfsm API for operators and services (SPEC-016, #689): /api/v1/instances
# and /api/v1/definitions, each request under its API key's role. No admin
# routes: those run on the internal pgfsm-api-admin Deployment.
#
# Secret (create before applying; see ../README.md):
#   pgfsm-api-db   Opaque   DATABASE_URL, logging in as fsm_authenticator
#                           (NOINHERIT; point it at the pooler)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgfsm-api
  labels: {
    app.kubernetes.io/name: pgfsm-api,
    app.kubernetes.io/part-of: pgfsm,
  }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: pgfsm-api }
  template:
    metadata:
      labels: {
        app.kubernetes.io/name: pgfsm-api,
        app.kubernetes.io/part-of: pgfsm,
      }
    spec:
      # SIGTERM: stop accepting, finish in-flight requests, close the pool.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/pgfsm/api:0.1.0 # published on each release (api-release.yml)
          args: ["--port=9999"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: pgfsm-api-db, key: DATABASE_URL }
          ports:
            - { name: http, containerPort: 9999 }
          readinessProbe:
            httpGet: { path: /api/v1/, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: pgfsm-api
  labels: {
    app.kubernetes.io/name: pgfsm-api,
    app.kubernetes.io/part-of: pgfsm,
  }
spec:
  selector: { app.kubernetes.io/name: pgfsm-api }
  ports:
    - { name: http, port: 80, targetPort: http }
